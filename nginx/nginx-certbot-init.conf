# ─── Config TEMPORAL: solo HTTP, para obtener el certificado SSL ─────────────
# Usada ÚNICAMENTE en el primer arranque para que Certbot pueda hacer
# el challenge y generar los certificados.
# Una vez obtenido el cert, el deploy.sh reemplaza esta config por nginx.conf.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    server {
        listen 80;
        server_name carbontrack.lat www.carbontrack.lat;

        # Responde a los challenges de Let's Encrypt
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Todo lo demás → 200 básico (sólo para pasar el init)
        location / {
            return 200 "Inicializando...\n";
            add_header Content-Type text/plain;
        }
    }
}
