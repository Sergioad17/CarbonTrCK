worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # ─── WHITELIST DE IPs ────────────────────────────────────────────────────
    # Agregá cada IP permitida con valor 1.
    # Para rangos usá notación CIDR: 203.0.113.0/24  1;
    geo $allowed_ip {
        default         0;

        # --- Agrega aquí las IPs autorizadas ---
        187.136.40.4    1;   # Sergio - Casa
        187.136.30.204  1;   # Pedro - Casa 
        200.68.181.252 1;   # Mike - Casa
        187.136.129.255 1;   # Itzel - Casa
        187.136.36.224 1; # Tec - Universidad
    }
    # ─────────────────────────────────────────────────────────────────────────

    # Redirigir HTTP → HTTPS
    server {
        listen 80;
        server_name carbontrack.lat www.carbontrack.lat;

        # Necesario para que certbot pueda renovar el certificado
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # Servidor principal HTTPS
    server {
        listen 443 ssl;
        http2 on;
        server_name carbontrack.lat www.carbontrack.lat;

        # ── SSL (Let's Encrypt via Certbot) ──
        ssl_certificate     /etc/letsencrypt/live/carbontrack.lat/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/carbontrack.lat/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        # ── Aplicar whitelist ──
        # Si la IP no está en la lista, devuelve 403
        if ($allowed_ip = 0) {
            return 403 "Acceso restringido. Contactá al administrador.\n";
        }

        # ── Frontend (archivos estáticos) ──
        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        # ── API → Backend ──
        # Todo lo que llegue a /api/... se manda al backend (quitando el prefijo /api)
        location /api/ {
            proxy_pass         http://backend:3001/;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        # ── Archivos estáticos con caché ──
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
}
