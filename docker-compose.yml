services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: carbontrack-p2-backend
    ports:
      - "3002:3001"
    env_file:
      - .env
    environment:
      APP_BASE_URL: http://localhost:3002
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: carbontrack-p2-frontend
    ports:
      - "3003:3000"
    env_file:
      - .env
    environment:
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      backend:
        condition: service_started
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: carbontrack-p2-postgres
    ports:
      - "5433:5432"
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/database/database.sql:/docker-entrypoint-initdb.d/001_database.sql:ro
      - ./backend/database/seed_catalogs.sql:/docker-entrypoint-initdb.d/002_seed_catalogs.sql:ro
      - ./backend/database/seed_auth.sql:/docker-entrypoint-initdb.d/003_seed_auth.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: carbontrack-p2-pgadmin
    profiles:
      - tools
    ports:
      - "5051:80"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  frontend_node_modules:
  postgres_data:
